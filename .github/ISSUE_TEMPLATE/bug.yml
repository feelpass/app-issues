name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Type
        - Type History
        - Cloak
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Check in Settings or the store
  - type: input
    id: device
    attributes:
      label: Device & OS
      placeholder: Galaxy S24, Android 16
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: media
    attributes:
      label: Screenshots & video
      description: Drag and drop files here
