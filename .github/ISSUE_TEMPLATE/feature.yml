name: Feature request
description: An idea or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Type
        - Type History
        - Cloak
        - Other
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it needed?
  - type: textarea
    id: media
    attributes:
      label: References
      description: Screenshots, links, examples from other apps
