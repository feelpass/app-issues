# Add an "app: <name>" label from the "App" field of the issue form
name: Label app
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const m = (issue.body || '').match(/### App\s+([^\n]+)/);
            if (!m) return;
            const want = `app: ${m[1].trim()}`;
            const current = issue.labels.map(l => l.name);
            const stale = current.filter(n => n.startsWith('app: ') && n !== want);
            for (const name of stale) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name });
            }
            if (!current.includes(want)) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [want] });
            }
